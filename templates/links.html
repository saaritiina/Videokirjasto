<!DOCTYPE html>
<html>

<head>
  <title>Kaikki videolinkit:</title>
</head>
<body>
    {% include "navigation.html" %}
    <h1>Kaikki videolinkit:</h1>

    {% for link in links %}
    <h3><a href="/link/{{ link['id'] }}">{{ link["title"] }}</a></h3>
    <p>
        <a href="{{ link['youtube_url'] }}" target="_blank">
            {{ link["youtube_url"] }}
        </a>
    </p>
    <p>
        Lisännyt: {{ link["username"] }}
    </p>
    {% if link["user_id"] == session.get("user_id") %}
        <a href="/edit_link/{{ link['id'] }}">Muokkaa</a>
    {% endif %}
    <hr>
    {% endfor %}
</body>
</html>
