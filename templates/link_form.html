<!DOCTYPE html>
<html>

<head>
  <title>{{ heading }}</title>
</head>
<body>
    {% include "navigation.html" %}
    <h1>{{ heading }}</h1>

    <form action="{{ form_action }}" method="post">
        <p>
            <label for="title">Videon nimi:</label><br>
            <input
                type="text"
                id="title"
                name="title"
                maxlength="300"
                value="{{ title }}"
                required>
        </p>

        <p>
            <label for="youtube_url">YouTube-linkki:</label><br>
            <input
                type="url"
                id="youtube_url"
                name="youtube_url"
                value="{{ youtube_url }}"
                required>
        </p>

        <button type="submit">{{ button_text }}</button>
    </form>
</body>
</html>
